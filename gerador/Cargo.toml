[package]
name = "gerador"
version = "0.1.0"
edition = "2024"
description = "Gera o índice de filiais por raiz de CNPJ a partir da base aberta da Receita"
publish = false

[dependencies]
anyhow = "1.0.104"
csv = "1.4.0"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = "3.5.2"
zip = { version = "9.4.0", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
